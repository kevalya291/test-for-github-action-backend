# Requires: mod_proxy, mod_proxy_http
# Enable on Debian/Ubuntu with:
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite quickkart-api
#   sudo systemctl reload apache2
#
# Exposes the backend directly on port 8080 (e.g. http://65.2.4.194:8080/api/health),
# separate from the frontend's own /api proxy on port 80. Add "Listen 8080" to
# /etc/apache2/ports.conf if it isn't already there.

<VirtualHost *:8080>
    ServerName 65.2.4.194

    # Node API is run by PM2 on this same host (see ecosystem.config.cjs),
    # listening on port 5000. Adjust if it runs elsewhere.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog ${APACHE_LOG_DIR}/quickkart-api-error.log
    CustomLog ${APACHE_LOG_DIR}/quickkart-api-access.log combined
</VirtualHost>
